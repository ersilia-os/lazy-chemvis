[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazychemvis"
version = "1.3.0"
description = "Automated 2D visualizations of chemical spaces"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name="Marina Miñarro", email="marina@ersilia.io"},
  {name="Miquel Duran-Frigola", email="miquel@ersilia.io"},
  {name="Ersilia Open Source Initiative", email="hello@ersilia.io"}
]
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.0",
  "scipy==1.17.0",
  "joblib==1.5.3",
  "tables==3.11.1",      
  "rdkit==2024.3.6",
  "fpsim2==0.7.4",
  "scikit-learn==1.7.2",
  "torch==2.9.1",
  "xgboost-cpu==3.1.3",   
  "matplotlib==3.10.8",
  "datashader==0.18.2",
  "stylia==1.0.1",
  "click==8.3.1",
  "rich-click==1.9.9",
  "rich==14.3.3",
  "loguru==0.7.3",
  "psutil==7.0.0",
]

[project.optional-dependencies]
fit = [
  "ersilia==0.1.62",
  "umap-learn==0.5.7",
  "opentsne==1.0.4",
  "optuna==4.7.0",
]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.11",
]

[project.urls]
Homepage = "https://github.com/ersilia-os/lazy-chemvis"
Repository = "https://github.com/ersilia-os/lazy-chemvis"
Issues = "https://github.com/ersilia-os/lazy-chemvis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
lazychemvis = "lazychemvis.cli.create_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
